<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Focus — Todo Planner</title>
<link rel="stylesheet" href="./css/shared.css">
<link rel="stylesheet" href="./css/todo.css">
<style>
  /* ---- Inlined styles that reference original todo design ---- */
  .app { padding: 0 20px; }

  /* Add bar */
  .add-bar {
    display: flex; gap: 8px;
    margin-bottom: 10px;
  }
  .add-input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 0.875rem;
    padding: 13px 15px;
    border-radius: var(--radius);
    outline: none;
    transition: var(--transition);
    height: 48px;
  }
  .add-input::placeholder { color: var(--text-dim); }
  .add-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-dim);
    background: var(--surface2);
  }
  .add-btn {
    background: var(--accent); border: none; color: #0e0e0f;
    font-family: var(--font-mono); font-size: 1.2rem; font-weight: 700;
    width: 48px; height: 48px; border-radius: var(--radius);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: var(--transition); line-height: 1;
  }
  .add-btn:hover  { transform: scale(1.05); filter: brightness(1.1); }
  .add-btn:active { transform: scale(0.97); }

  /* Priority picker */
  .priority-row { display: flex; gap: 6px; margin-bottom: 12px; }
  .prio-chip {
    padding: 6px 13px; border-radius: 99px;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text-muted); font-family: var(--font-mono);
    font-size: 0.67rem; letter-spacing: 0.08em; text-transform: uppercase;
    cursor: pointer; transition: var(--transition);
  }
  .prio-chip[data-prio="high"].selected { background: var(--red-dim);   border-color: var(--red);   color: var(--red); }
  .prio-chip[data-prio="mid"].selected  { background: var(--amber-dim);  border-color: var(--amber); color: var(--amber); }
  .prio-chip[data-prio="low"].selected  { background: var(--accent-dim); border-color: var(--accent);color: var(--accent); }

  /* Task list */
  .task-section { flex: 1; padding-bottom: 72px; }
  .section-label {
    font-size: 0.62rem; letter-spacing: 0.13em; text-transform: uppercase;
    color: var(--text-dim); margin-bottom: 10px;
    display: flex; align-items: center; gap: 10px;
  }
  .section-label::after { content:''; flex:1; height:1px; background:var(--border); }
  .task-list { display: flex; flex-direction: column; gap: 6px; }

  .task-item {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 13px 14px 13px 17px;
    display: flex; align-items: flex-start; gap: 12px;
    cursor: default;
    transition: border-color var(--transition), background var(--transition), opacity var(--transition);
    animation: slideIn 220ms cubic-bezier(0.4,0,0.2,1);
    position: relative; overflow: hidden;
  }
  .task-item::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  }
  .task-item[data-prio="high"]::before { background: var(--red); }
  .task-item[data-prio="mid"]::before  { background: var(--amber); }
  .task-item[data-prio="low"]::before  { background: var(--accent); }
  .task-item:hover     { border-color: var(--border-light); background: var(--surface2); }
  .task-item.completed { opacity: 0.45; }
  .task-item.completed:hover { opacity: 0.65; }
  .task-item.dragging  { opacity: 0.4; border-style: dashed; }
  .task-item.drag-over { border-color: var(--accent); background: var(--accent-glow); }

  /* Checkbox */
  .task-check {
    width: 20px; height: 20px; border-radius: 50%;
    border: 1.5px solid var(--border-light); flex-shrink: 0; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: var(--transition); margin-top: 1px;
  }
  .task-check:hover { border-color: var(--accent); background: var(--accent-dim); }
  .task-item.completed .task-check { background: var(--accent); border-color: var(--accent); }
  .task-check svg { display: none; }
  .task-item.completed .task-check svg { display: block; }

  .task-body   { flex: 1; min-width: 0; }
  .task-text   { font-size: 0.88rem; line-height: 1.45; color: var(--text); word-break: break-word; transition: var(--transition); }
  .task-item.completed .task-text { text-decoration: line-through; color: var(--text-dim); }
  .task-meta   { display: flex; align-items: center; gap: 8px; margin-top: 5px; flex-wrap: wrap; }
  .task-time   { font-size: 0.65rem; color: var(--text-dim); letter-spacing: 0.03em; }

  .task-prio-label { font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; padding: 2px 7px; border-radius: 99px; }
  .task-prio-label.high { background: var(--red-dim);   color: var(--red); }
  .task-prio-label.mid  { background: var(--amber-dim);  color: var(--amber); }
  .task-prio-label.low  { background: var(--accent-dim); color: var(--accent); }

  .task-actions {
    display: flex; align-items: center; gap: 4px; flex-shrink: 0;
    opacity: 0; transition: opacity var(--transition);
  }
  .task-item:hover .task-actions { opacity: 1; }
  @media (pointer: coarse) { .task-actions { opacity: 1; } }

  .task-action-btn {
    background: none; border: none; color: var(--text-dim); cursor: pointer;
    width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
    border-radius: var(--radius-sm); transition: var(--transition); font-size: 0.75rem;
  }
  .task-action-btn:hover        { background: var(--border); color: var(--text); }
  .task-action-btn.delete:hover { background: var(--red-dim); color: var(--red); }

  /* Empty state */
  .empty-state { text-align: center; padding: 48px 24px; color: var(--text-dim); }
  .empty-state .empty-icon { font-size: 2.5rem; margin-bottom: 12px; opacity: 0.4; }
  .empty-state p { font-family: var(--font-display); font-size: 1.2rem; font-style: italic; color: var(--text-muted); margin-bottom: 6px; }
  .empty-state span { font-size: 0.75rem; }

  /* Sort bar */
  .sort-bar { display: flex; align-items: center; gap: 5px; margin-bottom: 12px; flex-wrap: wrap; }
  .sort-label { font-size: 0.63rem; color: var(--text-dim); letter-spacing: 0.1em; text-transform: uppercase; margin-right: 2px; }
  .sort-chip {
    padding: 5px 11px; border-radius: 99px;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text-muted); font-family: var(--font-mono);
    font-size: 0.63rem; letter-spacing: 0.07em; text-transform: uppercase;
    cursor: pointer; transition: var(--transition);
  }
  .sort-chip.active { border-color: var(--border-light); color: var(--text); }
  .clear-done-btn {
    margin-left: auto; padding: 5px 11px; border-radius: 99px;
    border: 1px solid var(--red-dim); background: transparent; color: var(--red);
    font-family: var(--font-mono); font-size: 0.63rem; letter-spacing: 0.07em;
    text-transform: uppercase; cursor: pointer; transition: var(--transition);
  }
  .clear-done-btn:hover { background: var(--red-dim); }

  /* Footer stats */
  .footer-stats {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(14,14,15,0.92); backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    padding: 10px 20px; padding-bottom: calc(10px + env(safe-area-inset-bottom));
    display: flex; align-items: center; justify-content: center; gap: 28px;
  }
  .stat-item { display: flex; align-items: center; gap: 6px; font-size: 0.68rem; color: var(--text-muted); }
  .stat-num  { font-size: 0.88rem; font-weight: 500; color: var(--text); }
  .stat-accent { color: var(--accent); }

  /* Edit modal */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
    z-index: 100; display: flex; align-items: flex-end; justify-content: center;
    padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom));
    opacity: 0; pointer-events: none; transition: opacity 220ms ease;
  }
  .modal-backdrop.open { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--surface); border: 1px solid var(--border-light);
    border-radius: var(--radius); width: 100%; max-width: 560px; padding: 22px;
    transform: translateY(20px); transition: transform 220ms cubic-bezier(0.4,0,0.2,1);
  }
  .modal-backdrop.open .modal { transform: translateY(0); }
  .modal-title { font-family: var(--font-display); font-size: 1.25rem; margin-bottom: 14px; font-style: italic; }
  .modal-input {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); font-family: var(--font-mono); font-size: 0.875rem;
    padding: 11px 13px; border-radius: var(--radius-sm); outline: none;
    margin-bottom: 12px; transition: var(--transition);
  }
  .modal-input:focus { border-color: var(--accent); }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
  .modal-btn { padding: 10px 20px; border-radius: var(--radius-sm); border: none; font-family: var(--font-mono); font-size: 0.78rem; letter-spacing: 0.05em; cursor: pointer; transition: var(--transition); }
  .modal-btn.cancel { background: var(--border); color: var(--text-muted); }
  .modal-btn.cancel:hover { color: var(--text); }
  .modal-btn.save { background: var(--accent); color: #0e0e0f; font-weight: 500; }
  .modal-btn.save:hover { filter: brightness(1.1); }

  /* Search */
  .search-bar {
    display: flex; align-items: center; gap: 9px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 10px 13px; margin-bottom: 12px; transition: var(--transition);
  }
  .search-bar:focus-within { border-color: var(--border-light); }
  .search-icon   { color: var(--text-dim); font-size: 0.82rem; flex-shrink: 0; }
  .search-input  { flex: 1; background: none; border: none; color: var(--text); font-family: var(--font-mono); font-size: 0.83rem; outline: none; }
  .search-input::placeholder { color: var(--text-dim); }

  /* Reminder inline form buttons */
  .reminder-add-input {
    flex: 1; background: var(--surface); border: 1px solid var(--blue);
    color: var(--text); font-family: var(--font-mono); font-size: 0.8rem;
    padding: 9px 12px; border-radius: var(--radius-sm); outline: none;
    box-shadow: 0 0 0 3px rgba(87,176,255,0.1);
  }
  .reminder-add-input:focus { box-shadow: 0 0 0 4px rgba(87,176,255,0.18); }
  .reminder-add-input::placeholder { color: var(--text-dim); }
  .reminder-confirm-btn {
    background: var(--blue); border: none; color: #0e0e0f;
    font-family: var(--font-mono); font-size: 0.75rem; font-weight: 600;
    padding: 0 14px; border-radius: var(--radius-sm); cursor: pointer;
    transition: filter var(--transition), transform var(--transition); white-space: nowrap;
  }
  .reminder-confirm-btn:hover  { filter: brightness(1.12); transform: scale(1.03); }
  .reminder-confirm-btn:active { transform: scale(0.97); }
  .reminder-cancel-btn {
    background: var(--border); border: none; color: var(--text-muted);
    font-family: var(--font-mono); font-size: 0.75rem;
    padding: 0 10px; border-radius: var(--radius-sm); cursor: pointer;
    transition: color var(--transition), background var(--transition);
  }
  .reminder-cancel-btn:hover { color: var(--text); background: var(--border-light); }

  /* Animations */
  @keyframes slideIn {
    from { opacity:0; transform: translateY(-6px); }
    to   { opacity:1; transform: translateY(0); }
  }

  /* Responsive */
  @media (min-width: 480px) { .app { padding: 0 24px; } }
  @media (min-width: 640px) { .app { padding: 0 32px; } header { padding: 40px 0 28px; } }
  @media (min-width: 900px) { .app { max-width: 720px; padding: 0 40px; } }
</style>
</head>
<body>

<nav class="site-nav">
  <a class="site-nav-logo" href="./index.html">toolkit<span>.</span></a>
  <div class="site-nav-links">
    <a class="site-nav-link" href="./index.html">Home</a>
    <a class="site-nav-link active" href="./todo.html">Todo</a>
    <a class="site-nav-link" href="./free-time.html">Free Time</a>
    <a class="site-nav-link" href="./workout_plan.html">Workout</a>
  </div>
</nav>

<div class="app">

  <!-- HEADER -->
  <header>
    <div class="header-left">
      <div class="date-label" id="dateLabel"></div>
      <div class="app-title">Focus.</div>
    </div>
    <div class="progress-ring" title="Today's progress">
      <svg viewBox="0 0 46 46">
        <circle class="progress-track" cx="23" cy="23" r="22"/>
        <circle class="progress-fill" id="progressFill" cx="23" cy="23" r="22"/>
      </svg>
      <div class="progress-count" id="progressCount">0%</div>
    </div>
  </header>

  <!-- TABS -->
  <div class="tab-bar" role="tablist">
    <button class="tab-btn active" role="tab" data-tab="today"    onclick="switchTab('today')">Today <span class="count-badge" id="badge-today">0</span></button>
    <button class="tab-btn"        role="tab" data-tab="tomorrow" onclick="switchTab('tomorrow')">Tomorrow <span class="count-badge" id="badge-tomorrow">0</span></button>
    <button class="tab-btn"        role="tab" data-tab="future"   onclick="switchTab('future')">Future <span class="count-badge" id="badge-future">0</span></button>
    <button class="tab-btn"        role="tab" data-tab="allday"   onclick="switchTab('allday')">Fixed <span class="count-badge" id="badge-allday">0</span></button>
  </div>

  <!-- REMINDERS — HORIZONTAL SCROLL -->
  <div class="reminders-section" id="remindersSection">
    <div class="reminders-header">
      <span class="reminders-label">
        <span class="reminders-dot"></span>
        Reminders
        <span class="reminders-count" id="remindersCount">0</span>
      </span>
      <button class="reminders-add-btn" onclick="toggleReminderInput()" id="remindersAddBtn">+ Add</button>
    </div>
    <div class="reminders-track-wrap" id="remindersTrackWrap">
      <div class="reminders-scroll-hint">›</div>
      <div class="reminders-track" id="remindersTrack"></div>
    </div>
    <div class="reminder-add-inline" id="reminderAddInline">
      <input class="reminder-add-input" id="reminderInput" placeholder="Reminder text..." maxlength="120" autocomplete="off" onkeydown="handleReminderKey(event)">
      <button class="reminder-confirm-btn" onclick="addReminder()">Add</button>
      <button class="reminder-cancel-btn" onclick="closeReminderInput()">✕</button>
    </div>
  </div>

  <!-- ALL-DAY SECTION -->
  <div class="allday-section" id="alldaySection">
    <div class="allday-header" onclick="toggleAllday()">
      <span class="allday-label"><span class="allday-dot"></span> Fixed Daily Tasks</span>
      <span class="allday-toggle" id="alldayToggleIcon">&#9650;</span>
    </div>
    <div class="allday-body" id="alldayBody">
      <div class="task-list" id="alldayList"></div>
    </div>
  </div>

  <!-- ADD BAR -->
  <div class="add-bar">
    <input class="add-input" id="addInput" placeholder="New task..." autocomplete="off" autocorrect="off" spellcheck="false" maxlength="200" onkeydown="handleAddKey(event)">
    <button class="add-btn" onclick="addTask()" title="Add (Enter)">+</button>
  </div>

  <!-- PRIORITY -->
  <div class="priority-row" id="priorityRow">
    <button class="prio-chip" data-prio="high" onclick="selectPrio('high')">High</button>
    <button class="prio-chip" data-prio="mid"  onclick="selectPrio('mid')">Mid</button>
    <button class="prio-chip selected" data-prio="low" onclick="selectPrio('low')">Low</button>
  </div>

  <!-- SEARCH -->
  <div class="search-bar">
    <span class="search-icon">⌕</span>
    <input class="search-input" id="searchInput" placeholder="Search tasks… ( / )" oninput="renderTasks()" autocomplete="off">
  </div>

  <!-- SORT + CLEAR -->
  <div class="sort-bar">
    <span class="sort-label">Sort</span>
    <button class="sort-chip active" data-sort="manual"   onclick="setSort('manual')">Manual</button>
    <button class="sort-chip"        data-sort="priority" onclick="setSort('priority')">Priority</button>
    <button class="sort-chip"        data-sort="time"     onclick="setSort('time')">Time</button>
    <button class="clear-done-btn" onclick="clearCompleted()">Clear done</button>
  </div>

  <!-- TASK LIST -->
  <div class="task-section">
    <div class="section-label" id="sectionLabel">Today</div>
    <div class="task-list" id="taskList"></div>
  </div>

</div><!-- /.app -->

<!-- FOOTER STATS -->
<div class="footer-stats">
  <div class="stat-item"><span class="stat-num stat-accent" id="statDone">0</span> done</div>
  <div class="stat-item"><span class="stat-num" id="statLeft">0</span> left</div>
  <div class="stat-item"><span class="stat-num" id="statTotal">0</span> total</div>
</div>

<!-- EDIT MODAL -->
<div class="modal-backdrop" id="editModal" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-title">Edit task</div>
    <input class="modal-input" id="editInput" placeholder="Task text..." maxlength="200" onkeydown="handleEditKey(event)">
    <div class="priority-row">
      <button class="prio-chip" data-prio="high" onclick="selectEditPrio('high')">High</button>
      <button class="prio-chip" data-prio="mid"  onclick="selectEditPrio('mid')">Mid</button>
      <button class="prio-chip" data-prio="low"  onclick="selectEditPrio('low')">Low</button>
    </div>
    <div class="modal-actions">
      <button class="modal-btn cancel" onclick="closeEditModal()">Cancel</button>
      <button class="modal-btn save"   onclick="saveEdit()">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="./js/shared.js"></script>
<script src="./js/todo.js"></script>
</body>
</html>
